# RAG evaluation set (Phase 7): questions an operator would ask, with the reference answer and the
# exact document sections that contain it. Used to measure retrieval precision / context recall
# (do the retrieved chunks include `sources`?), groundedness and citation accuracy.
#
# type: factual (one fact) | procedural (steps) | multi_hop (needs two sections or documents)
#       | unanswerable (not in the documents: the system must say it does not know)
# sources: list of "doc_id#section_id"; empty for unanswerable questions.

- id: Q001
  type: factual
  question: How big is the warehouse floor?
  answer: 80 m wide (east-west) by 50 m deep (north-south), managed as a grid of 1 m x 1 m cells.
  sources: [warehouse_manual#WM-2.1]
- id: Q002
  type: factual
  question: Which zone is in the south-east of the building?
  answer: Zone D (ZONE_D), x 42-76, y 24-42.
  sources: [warehouse_manual#WM-2.2]
- id: Q003
  type: factual
  question: How many robots can a storage zone hold before it counts as at capacity?
  answer: Each zone is planned for up to 10 robots; congestion is robots in the zone divided by 10, and 1.0 means at capacity.
  sources: [warehouse_manual#WM-2.2]
- id: Q004
  type: factual
  question: Where does the main highway run?
  answer: North-south through the middle of the building at x 38-41, with four two-way lanes.
  sources: [warehouse_manual#WM-2.3]
- id: Q005
  type: factual
  question: Where are the structural columns?
  answer: On the main highway at (38, 12), (41, 12), (38, 34) and (41, 34).
  sources: [warehouse_manual#WM-2.4, safety_rules#SAF-3.5]
- id: Q006
  type: factual
  question: Where is packing station 4?
  answer: PACK_4 is at (46, 49) on the south wall.
  sources: [warehouse_manual#WM-2.5]
- id: Q007
  type: factual
  question: How many robots can unload at one packing station at the same time?
  answer: Three; each packing station has three drop bays.
  sources: [warehouse_manual#WM-2.5]
- id: Q008
  type: factual
  question: How many charging bays are there in total and where are the chargers?
  answer: 12 bays in four chargers with three bays each - CHG_1 (0, 10) and CHG_2 (0, 35) on the west wall, CHG_3 (79, 10) and CHG_4 (79, 35) on the east wall.
  sources: [warehouse_manual#WM-2.6]
- id: Q009
  type: factual
  question: Where is parking area P5?
  answer: P5 "South-west wall" is along the west wall at x 0, y 25-31.
  sources: [warehouse_manual#WM-2.7]
- id: Q010
  type: factual
  question: How many parking bays does the warehouse have?
  answer: 88 bays in eight parking areas (P1 to P8).
  sources: [warehouse_manual#WM-2.7]
- id: Q011
  type: factual
  question: What does the location code B-14-50 mean?
  answer: Zone B, rack row y = 14, bay x = 50.
  sources: [warehouse_manual#WM-3.2]
- id: Q012
  type: factual
  question: Do robots drive into the racks to pick?
  answer: No. They stop on the pick face, the walkable aisle cell directly beside the bay (normally the cell to the south, otherwise to the north).
  sources: [warehouse_manual#WM-3.3]
- id: Q013
  type: factual
  question: From which cell is bay A-05-12 picked?
  answer: From (12, 4), in Aisle 1.
  sources: [warehouse_manual#WM-3.3]
- id: Q014
  type: factual
  question: How many rack bays and how many levels do the racks have?
  answer: 1,584 rack bays, four levels high, one product per bay.
  sources: [warehouse_manual#WM-3.1]
- id: Q015
  type: factual
  question: In which direction must robots drive in Aisle 7, and where is it?
  answer: Westwards. Aisle 7 is the third segment of row y = 7 (x 42-58) in Zone B.
  sources: [warehouse_manual#WM-4.2]
- id: Q016
  type: factual
  question: Why are the picking aisles one-way?
  answer: They are one robot wide; alternating one-way directions mean two robots never meet head-on in an aisle.
  sources: [warehouse_manual#WM-4.1]
- id: Q017
  type: factual
  question: How many picking aisles are there?
  answer: 52 aisles, Aisle 1 to Aisle 52 (AISLE_01 to AISLE_52).
  sources: [warehouse_manual#WM-4.2]
- id: Q018
  type: factual
  question: Which zones are served by aisles 25 to 28?
  answer: Row y = 24, driven east; Aisles 25 and 26 are in Zone C, 27 and 28 in Zone D.
  sources: [warehouse_manual#WM-4.2]
- id: Q019
  type: factual
  question: What is the deadline of a HIGH priority order?
  answer: 240 ticks after creation, which is 2 minutes at normal speed.
  sources: [warehouse_manual#WM-5.2]
- id: Q020
  type: factual
  question: What share of orders is LOW priority?
  answer: About 30 %.
  sources: [warehouse_manual#WM-5.2]
- id: Q021
  type: factual
  question: What are the stages of an order's life cycle?
  answer: PENDING, then ASSIGNED, then IN_PROGRESS, then DELIVERED or LATE.
  sources: [warehouse_manual#WM-5.3]
- id: Q022
  type: factual
  question: How does the dispatcher choose which robot gets an order?
  answer: Waiting orders are taken highest priority first, then oldest first; each goes to the nearest free robot with at least 20 % battery, measured to the order's first rack.
  sources: [warehouse_manual#WM-5.4]
- id: Q023
  type: factual
  question: How long does a robot spend picking and unloading?
  answer: 4 ticks per order line at the rack face and 3 ticks to unload at the packing station.
  sources: [warehouse_manual#WM-5.5]
- id: Q024
  type: factual
  question: Which packing station does a robot deliver to?
  answer: The packing station nearest its last rack, using the least busy of the three drop bays.
  sources: [warehouse_manual#WM-5.5]
- id: Q025
  type: procedural
  question: What does a robot do when the cell ahead of it is taken?
  answer: It queues up to 20 ticks if the robot ahead is working; otherwise it replans around nearby robots after 2 blocked ticks and steps aside into a free neighbouring cell after 4-7 blocked ticks.
  sources: [warehouse_manual#WM-6.2]
- id: Q026
  type: factual
  question: Can routes pass through parking bays?
  answer: No. Parking bays may only be entered by a robot that is parking there.
  sources: [warehouse_manual#WM-6.3]
- id: Q027
  type: factual
  question: How do idle robots choose where to park?
  answer: They pick a bay that is close but in an area that is not already full, using cost = distance in metres + 150 x the share of that area's bays taken.
  sources: [warehouse_manual#WM-7.1]
- id: Q028
  type: factual
  question: How is throughput defined?
  answer: The number of orders delivered in the last simulated hour.
  sources: [warehouse_manual#WM-8]
- id: Q029
  type: factual
  question: What is the target for late orders?
  answer: Late orders below 5 % on ordinary days.
  sources: [warehouse_manual#WM-8.1]
- id: Q030
  type: factual
  question: What is the top speed of the robots?
  answer: 2 m/s, one grid cell per tick at normal simulation speed.
  sources: [robot_manual#RM-2.1]
- id: Q031
  type: factual
  question: What does a robot report on every tick?
  answer: Position, heading, status, battery level, drive-motor temperature, load, current task and planned route.
  sources: [robot_manual#RM-1.2]
- id: Q032
  type: factual
  question: When does a robot drive at half speed?
  answer: When it has a speed degradation fault or when its motor is above the throttle temperature of 60 C.
  sources: [robot_manual#RM-2.4]
- id: Q033
  type: factual
  question: What does the PAUSED status mean?
  answer: The robot was stopped by an operator command and resumes only on a resume command.
  sources: [robot_manual#RM-3]
- id: Q034
  type: factual
  question: How much battery does a robot use per metre?
  answer: 0.05 % per metre driven (and 0.01 % per order line picked); a full battery covers about 2 km.
  sources: [robot_manual#RM-4.1]
- id: Q035
  type: procedural
  question: What should happen when a robot's battery falls below the low threshold?
  answer: Below 20 % the robot receives no new orders and drives to the nearest free charging bay; no operator action is needed while it is on its way (SOP-01).
  sources: [robot_manual#RM-4.2, sops#SOP-01]
- id: Q036
  type: procedural
  question: What should happen when a robot's battery falls below the critical threshold?
  answer: Below 10 % operator action is required - pause the robot if it could block an aisle or lane, reassign its order, tow it to the nearest charger, resume it once docked, and record the robot ID as a possible battery fault.
  sources: [robot_manual#RM-4.2, sops#SOP-02]
- id: Q037
  type: factual
  question: At what battery level does charging stop?
  answer: At 95 %; the robot then returns to parking.
  sources: [robot_manual#RM-4.2]
- id: Q038
  type: factual
  question: How long does it take to charge from 20 to 95 percent?
  answer: About 38 ticks (about 19 seconds at normal speed), at 2 % per tick.
  sources: [robot_manual#RM-4.3]
- id: Q039
  type: factual
  question: What is opportunity charging?
  answer: When no orders are waiting, idle robots below 70 % top up at a free charger, so the robots in the parking rows stay charged for the next rush.
  sources: [robot_manual#RM-4.2, robot_manual#RM-4.5]
- id: Q040
  type: factual
  question: What happens when all charging bays are taken?
  answer: A robot that only wants a top-up stays parked and tries again later; a low-battery robot keeps waiting for the nearest free bay.
  sources: [robot_manual#RM-4.4]
- id: Q041
  type: factual
  question: What is a normal motor temperature for a robot driving with a load?
  answer: About 44 C (parked about 24 C, charging about 32 C, driving empty about 39 C).
  sources: [robot_manual#RM-5.2]
- id: Q042
  type: factual
  question: What is thermal throttling?
  answer: Above 60 C the robot reduces itself to half speed to protect the motor.
  sources: [robot_manual#RM-5.3]
- id: Q043
  type: factual
  question: How accurate is the temperature sensor?
  answer: It has a noise of about 0.3 C, so trends over several readings should be used rather than a single value.
  sources: [robot_manual#RM-5.4]
- id: Q044
  type: factual
  question: Which fault types are monitored?
  answer: battery_spike, speed_degradation, stop_event, route_deviation and overheating.
  sources: [robot_manual#RM-6.1]
- id: Q045
  type: factual
  question: How long does a stop event usually last?
  answer: 15-60 ticks; the robot stops completely with status FAULT.
  sources: [robot_manual#RM-6.1, maintenance_guides#MG-4.1]
- id: Q046
  type: factual
  question: When is an overheating fault cleared?
  answer: Only when the motor has cooled below 55 C.
  sources: [robot_manual#RM-6.2, maintenance_guides#MG-6.2]
- id: Q047
  type: factual
  question: Why can an order assignment be rejected?
  answer: When the robot is paused, faulty, busy with another order or charging, has battery below 20 %, the order is no longer waiting, or the order needs a rack in a closed aisle.
  sources: [robot_manual#RM-7.2]
- id: Q048
  type: factual
  question: Can AI tools change robot data directly?
  answer: No. They submit the same validated commands as an operator, applied at the next tick.
  sources: [robot_manual#RM-7.3, robot_manual#RM-7.1]
- id: Q049
  type: factual
  question: Who has priority, people or robots?
  answer: People always have priority; robots treat every person as an obstacle and stop or plan around them.
  sources: [safety_rules#SAF-1.1]
- id: Q050
  type: factual
  question: What personal protective equipment is required on the robot floor?
  answer: High-visibility vests and safety shoes beyond the control-center door.
  sources: [safety_rules#SAF-1.2]
- id: Q051
  type: factual
  question: Where should associates walk through the building?
  answer: On the highways and cross aisles; avoid the one-robot-wide picking aisles unless the task requires it.
  sources: [safety_rules#SAF-2.1]
- id: Q052
  type: factual
  question: What is a restricted zone?
  answer: An area robots must not enter and people may enter only for the work that created it.
  sources: [safety_rules#SAF-3.1]
- id: Q053
  type: factual
  question: Who may enter a closed aisle?
  answer: Only the people doing the maintenance, cleanup or inspection; it is restricted for its whole length until it reopens, with barriers at both ends.
  sources: [safety_rules#SAF-3.2]
- id: Q054
  type: procedural
  question: Can I close Aisle 12 while a robot is picking in it?
  answer: No. An aisle may only be closed when no robot or person is inside and no robot is about to pick from it; wait until the robot has left, or pause it and reassign its order first.
  sources: [safety_rules#SAF-3.6, sops#SOP-05]
- id: Q055
  type: factual
  question: Are the charging areas restricted?
  answer: Yes. The charging bays at CHG_1 to CHG_4 are restricted to robots and maintenance staff; do not touch charging contacts.
  sources: [safety_rules#SAF-3.4]
- id: Q056
  type: procedural
  question: How do I stop the whole fleet in an emergency?
  answer: Pause the simulation so all robots stop at once - for an injury, a fire alarm, or several robots behaving abnormally.
  sources: [safety_rules#SAF-4.2]
- id: Q057
  type: factual
  question: When may a paused robot be resumed?
  answer: Only after the person who requested the pause confirms the area is clear.
  sources: [safety_rules#SAF-4.3]
- id: Q058
  type: factual
  question: Can I touch an overheating robot?
  answer: Not on the drive unit until it has cooled below 55 C (follow SOP-04).
  sources: [safety_rules#SAF-5.2]
- id: Q059
  type: procedural
  question: What signals indicate that a robot is wandering off its route?
  answer: Its route length grows instead of shrinking while it leaves the planned route (route deviation).
  sources: [maintenance_guides#MG-1.2, maintenance_guides#MG-5.1]
- id: Q060
  type: procedural
  question: How do I tell traffic from a real fault when a robot is slow?
  answer: Check whether it is blocked by other robots, a worker, a closed aisle or a floor hazard (blocked-tick counter, zone congestion) before calling a fault.
  sources: [maintenance_guides#MG-1.3]
- id: Q061
  type: procedural
  question: What do we do after two battery spikes on the same robot in a shift?
  answer: Take it out of service and inspect the battery pack and connectors.
  sources: [maintenance_guides#MG-2.2]
- id: Q062
  type: procedural
  question: A robot is slow although its route is free. What should I check first?
  answer: Its motor temperature; above 60 C it is thermal throttling (see MG-6), otherwise suspect a drive-wheel or encoder problem.
  sources: [maintenance_guides#MG-3.2]
- id: Q063
  type: procedural
  question: What causes repeated route deviations and how is it fixed?
  answer: A localisation problem; recalibrate the robot's floor-marker camera at the next charging stop.
  sources: [maintenance_guides#MG-5.2]
- id: Q064
  type: factual
  question: When is a robot inspected because of its fault count?
  answer: Any robot with five or more faults in a day is inspected before the next shift.
  sources: [maintenance_guides#MG-7.1]
- id: Q065
  type: factual
  question: How often are cameras calibrated?
  answer: Monthly, together with the floor-marker readers and the charger contacts.
  sources: [maintenance_guides#MG-7.3]
- id: Q066
  type: procedural
  question: Robot 14 is stopped in FAULT status. What should I do?
  answer: Check its status and position without sending anyone into a narrow aisle to push it; wait up to 60 ticks; if it carries a HIGH-priority order with less than 120 ticks left, pause it and reassign now; after 60 ticks pause it, reassign its order and call a technician.
  sources: [sops#SOP-03]
- id: Q067
  type: procedural
  question: When should an overheating robot be paused?
  answer: When its temperature keeps rising above 70 C - pause it at the next safe stop (parking bay or wide highway lane, never a narrow aisle) and reassign its order.
  sources: [sops#SOP-04]
- id: Q068
  type: procedural
  question: When can an overheated robot receive new orders again?
  answer: When its temperature is below 55 C.
  sources: [sops#SOP-04]
- id: Q069
  type: procedural
  question: What happens to orders that need a rack in a closed aisle?
  answer: They wait in the queue and are assigned automatically once the aisle reopens.
  sources: [sops#SOP-05, warehouse_manual#WM-5.4]
- id: Q070
  type: procedural
  question: A parcel has fallen on the cross highway. What is the procedure?
  answer: The cell is closed to robots and routes are changed automatically; send the nearest associate to remove it (a parcel goes back to its packing station), watch for robots queuing beside it, and it is resolved when HAZARD_CLEARED is logged, normally within 3-12 minutes.
  sources: [sops#SOP-06]
- id: Q071
  type: procedural
  question: How do I prioritise all urgent orders?
  answer: The dispatcher already serves HIGH-priority orders first; find why they wait (no free robot, low batteries, closed aisle), reopen a closed aisle if needed, use manual assignment for the most urgent ones, and report expected late orders.
  sources: [sops#SOP-07]
- id: Q072
  type: procedural
  question: How do I assign orders by hand?
  answer: Switch assignment mode to manual, then assign each order with assign_order(robot_id, order_id) to a free robot with at least 20 % battery near the first rack; read the reason of any rejection; switch back to automatic when finished.
  sources: [sops#SOP-08]
- id: Q073
  type: procedural
  question: Robot 7 is blocking the main aisle. How should it be handled?
  answer: Get its status (paused, fault, waiting behind a working robot, blocked by a person or hazard), check nearby robots, resume it if paused and safe or follow SOP-03 if faulty, reroute it or send it to parking if it blocks a busy lane, reassign its order if needed, and verify no robot is blocked more than 20 ticks.
  sources: [sops#SOP-09]
- id: Q074
  type: procedural
  question: How should we prepare for Black Friday?
  answer: Charge all robots above 70 %, keep aisles open and postpone routine maintenance closures, watch queue length and late percentage hourly, expect late LOW-priority orders at the busiest hours, and raise stock of top sellers in advance.
  sources: [sops#SOP-10, inventory_policies#INV-6.3]
- id: Q075
  type: factual
  question: What is the product ID of the item stored in bay C-31-20?
  answer: P-C-31-20 (on shelf SH-C-31-20).
  sources: [inventory_policies#INV-1.2]
- id: Q076
  type: factual
  question: At what stock level is a bay replenished?
  answer: When its stock falls below 10 units a replenishment is raised automatically.
  sources: [inventory_policies#INV-3.1]
- id: Q077
  type: factual
  question: How long does replenishment take and how much is delivered?
  answer: 300-900 ticks; the delivery adds 60-120 units and is logged as INVENTORY_RESTOCKED.
  sources: [inventory_policies#INV-3.2]
- id: Q078
  type: factual
  question: Can a customer order a product with zero stock?
  answer: No. Only products with stock above zero can be ordered; it is out of stock until replenished.
  sources: [inventory_policies#INV-2.3]
- id: Q079
  type: factual
  question: How often are rack rows counted?
  answer: Every rack row once a week; high-velocity rows (top 10 % by units picked) twice a week.
  sources: [inventory_policies#INV-5.1]
- id: Q080
  type: factual
  question: When are orders busiest on a weekday?
  answer: Around 09:00-10:00 and 14:00-15:00; quiet at night, about a fifth of the average rate between 01:00 and 04:00.
  sources: [inventory_policies#INV-6.1]
- id: Q081
  type: factual
  question: How much volume does a Sunday have compared with a weekday?
  answer: About 66 % (Saturday about 80 %).
  sources: [inventory_policies#INV-6.2]
- id: Q082
  type: multi_hop
  question: Robot R22 shows 63 C and is moving slowly. Is that a fault, and what should I do?
  answer: Above 60 C it is overheating and thermal throttling to half speed; let it finish its order, pause it at a safe stop if it rises above 70 C, and give it no new orders until it is below 55 C.
  sources: [robot_manual#RM-5.3, sops#SOP-04]
- id: Q083
  type: multi_hop
  question: If I close Aisle 1, which products can no longer be picked?
  answer: Products whose pick face lies in Aisle 1 (row y = 4, x 3-18), i.e. the bays of rack row 5 in Zone A between x 3 and 18 such as A-05-12; orders for them wait until the aisle reopens.
  sources: [warehouse_manual#WM-3.3, warehouse_manual#WM-4.2, sops#SOP-05]
- id: Q084
  type: multi_hop
  question: Why was a HIGH-priority order late while its racks were in a closed aisle?
  answer: Orders needing a rack in a closed aisle are not assigned until the aisle reopens, and a HIGH order has only 240 ticks before its deadline, so a closure of 10-40 minutes can make it late.
  sources: [warehouse_manual#WM-5.4, warehouse_manual#WM-5.2, sops#SOP-05]
- id: Q085
  type: multi_hop
  question: Can a robot with 18 % battery be given an urgent order manually?
  answer: No. Below 20 % assignments are rejected (battery too low); the robot is on its way to charge. Choose another free robot.
  sources: [robot_manual#RM-7.2, robot_manual#RM-4.2, sops#SOP-08]
- id: Q086
  type: multi_hop
  question: Which charger should a robot with critical battery near (2, 33) be taken to?
  answer: The nearest one on the west wall, CHG_2 at (0, 35).
  sources: [sops#SOP-02, warehouse_manual#WM-2.6]
- id: Q087
  type: multi_hop
  question: A robot's battery dropped from 64 % to 41 % in one step. What is it and what next?
  answer: A battery spike fault (a sudden 12-30 % drop). The robot is above 20 % so it keeps working; note its ID, and if it spikes twice in a shift take it out of service for a battery inspection.
  sources: [robot_manual#RM-6.1, maintenance_guides#MG-2.2]
- id: Q088
  type: multi_hop
  question: How many robots can charge at the same time and how long does a full top-up from 70 % take?
  answer: 12 robots (4 chargers x 3 bays); from 70 % to 95 % takes about 13 ticks at 2 % per tick.
  sources: [warehouse_manual#WM-2.6, robot_manual#RM-4.3]
- id: Q089
  type: unanswerable
  question: What is the price of a Smart speaker?
  answer: The documents do not contain product prices.
  sources: []
- id: Q090
  type: unanswerable
  question: What is the Wi-Fi password for the robot network?
  answer: The documents do not contain network credentials.
  sources: []
- id: Q091
  type: unanswerable
  question: Who is the shift lead on Sunday?
  answer: The documents do not name staff or shift rosters.
  sources: []
- id: Q092
  type: unanswerable
  question: How much does an AMR-500 robot weigh?
  answer: The documents do not state the robot's weight.
  sources: []
- id: Q093
  type: unanswerable
  question: Which courier collects parcels from the packing stations?
  answer: The documents do not name couriers.
  sources: []
- id: Q094
  type: unanswerable
  question: What is the maximum payload of a robot in kilograms?
  answer: The documents do not state a payload limit.
