# All tunable numbers live here, never in code.
world:
  width: 30
  depth: 20
  cell_size_m: 1.0
time:
  tick_seconds: 1
  shift_hours: 8
fleet:
  robots: 10
  move_cells_per_tick: 1
  battery:
    drain_moving_pct_per_tick: 0.02
    drain_idle_pct_per_tick: 0.005
    drain_loaded_extra_pct_per_tick: 0.01
    go_charge_threshold_pct: 20
    critical_pct: 5
    charge_pct_per_tick: 0.1
timing_ticks:
  retrieve_level_1_to_4: [4, 5, 6, 8]
  handover_to_station: 2
  pick_line: 8
  pack_and_label: 10
  diverter_switch: 1
  dock_window: 120
conveyor:
  belt_cells_per_tick: 0.5
conflicts:
  winner_order: [order_priority, longest_wait, lowest_robot_id]
  replan_after_wait_ticks: 3
  deadlock_after_ticks: 5
recording:
  metrics_every_ticks: 10
  snapshot_every_ticks: 300
  full_frame_every_ticks: 60
