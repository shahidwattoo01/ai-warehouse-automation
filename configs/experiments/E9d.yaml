# E9d — Full Phase 9: E9c + MARL navigation policy (Phase 9)
experiment_id: E9d
name: "Full Phase 9 — MARL navigation"
phase: 9
description: >-
  Adds the trained shared-policy MARL navigator (ai/reinforcement_learning/marl.py) on top
  of E9c.  The RL policy replaces the A* route planner for navigation decisions; assignment
  strategy (global Hungarian) and all other Phase 9 features remain active.  Final comparison
  vs E4d (Phase 4 best).  Weights: models/navigation_marl/marl_ep300/weights.pt.
layout: large
seeds: [101, 102, 103, 104, 105]
hours: 24
independent_streams: true
metrics: [avg_completion_ticks, p90_completion_ticks, late_percent, throughput_per_hour,
          avg_queue_ticks, distance_m, blocked_events, avg_pending, utilisation_percent,
          batch_fill_rate, collision_events, physics_overhead_ticks, slotting_swaps,
          rl_mean_reward, rl_orders_per_episode]
strategies: {assignment: global, planner: marl, traffic_aware: false, positioning: balanced, charging: threshold, replanning: false}
batch_picking: {enabled: true, tote_capacity: 3, cluster_radius: 8}
space_time: {enabled: true, horizon_ticks: 60, deadlock_check_every: 10}
physics: {enabled: true, max_speed_ms: 1.5, accel_ms2: 0.5, turn_speed_ms: 0.4}
slotting: {enabled: true, reoptimise_every_hours: 24, velocity_window_hours: 168}
marl_weights: models/navigation_marl/marl_ep300/weights.pt
