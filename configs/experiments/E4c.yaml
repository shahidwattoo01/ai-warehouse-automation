# E4c — ETA-based assignment, BFS routes (diagnostic) (Phase 4, run with scripts/run_experiments.py)
experiment_id: E4c
name: "ETA-based assignment, BFS routes (diagnostic)"
phase: 4
description: >-
  Diagnostic for E4: the ETA-based robot choice with the baseline BFS routes, to measure the AI assignment on its own.
layout: large
seeds: [101, 102, 103, 104, 105]   # same seeds for every experiment (paired comparison)
hours: 24                          # one simulated day per run (600 ticks per hour)
independent_streams: true          # orders, faults and hazards identical across experiments
metrics: [avg_completion_ticks, p90_completion_ticks, late_percent, throughput_per_hour,
          avg_queue_ticks, distance_m, blocked_events, avg_pending, utilisation_percent]
strategies: {assignment: eta, planner: bfs, traffic_aware: false, positioning: balanced, charging: threshold, replanning: false}
