    evidence: "wms/outbound.py: totes, cartonisation and weight check, GS1 shipping label (00/420/3301), carrier lanes, loading, scheduled trucks with cut-offs, continuous or wave release, manifests and ship confirmations; docs/wms_outbound.md, ADR 010"
  - id: PR-09
