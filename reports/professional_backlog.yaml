# Professional-readiness backlog: everything between this project and real warehouse software
# (comparison of 24 Oct 2026, extended by the audit of 30 Oct 2026). Every item is planned into a remaining phase and must be done
# before the project is final. Rendered as its own page in the progress report
# (scripts/build_project_report.py); set `status: done` and `evidence:` when an item is finished.
#
# priority: high = expected by any real customer · medium = needed for a credible pilot ·
#           low = completes the picture
# effort:   S (days) · M (1-2 weeks) · L (several weeks)

items:
  # ----- Users and security ---------------------------------------------------------------
  - id: PR-01
    area: Security
    gap: No login; anyone who can open the app controls the warehouse
    build: Login, roles (operator, supervisor, admin) with permissions per action; every approval and command recorded with the user who made it
    phase: 10
    priority: high
    effort: M
    status: done
    evidence: "JWT access + rotating refresh tokens, 5 roles / 23 permissions on every endpoint, user admin page, login audit; docs/authentication.md"
  - id: PR-02
    area: Security
    gap: Local-only hardening
    build: HTTPS, rate limiting, secrets from a vault / environment only, security headers, session expiry
    phase: 12
    priority: high
    effort: S
    status: partial
    evidence: "Rate limits per client (login 10/min, changes 120/min, all 600/min; 429 + Retry-After), security headers on API and UI (CSP, nosniff, no framing, no-store on tokens, HSTS behind HTTPS), secrets from .env only, 15 min access / 7 day refresh sessions; HTTPS itself still to set up at deployment"

  # ----- Fleet and execution --------------------------------------------------------------
  - id: PR-03
    area: Fleet
    gap: A robot carries one order per trip
    build: Batch picking (several orders per trip, tote capacity), batching rules compared in the experiments
    phase: 9
    priority: high
    effort: M
    status: planned
  - id: PR-04
    area: Fleet
    gap: No time-based traffic control
    build: Path reservation over time (no head-on meetings), deadlock detection and recovery, intersection rules
    phase: 9
    priority: high
    effort: M
    status: planned
  - id: PR-05
    area: Fleet
    gap: Robots move cell by cell without physics
    build: Acceleration, braking and turning times, finer positions; travel times calibrated to a real AMR data sheet
    phase: 9
    priority: medium
    effort: M
    status: planned
  - id: PR-06
    area: Fleet
    gap: One layout and fleet size
    build: Scale runs with 100+ robots and a second layout; performance limits documented
    phase: 11
    priority: medium
    effort: M
    status: done
    evidence: "Scale benchmark: both layouts at 6-88 robots, fixed and fleet-scaled demand; large layout scales to 182 orders/h at 88 robots (its parking limit), small layout tops out at ~120/h; 15.8 ms per tick at 88 robots (~30x real time); docs/scale.md. 100+ robots need a bigger layout (phase 9)"

