  # ----- Safety and compliance -------------------------------------------------------------
  - id: PR-23
    area: Safety
    gap: Safety only in the simulation and the vision thresholds
    build: Software emergency stop for the whole fleet, slow zones near people, a safety event log; documented hand-off to certified robot safety (ISO 3691-4, ANSI/RIA R15.08), which lives in the robot hardware
    phase: 10
    priority: high
    effort: M
    status: done
    evidence: "Fleet and zone e-stop with release and separate reset (no automatic restart), slow zones near people, near-miss detection, safety log in PostgreSQL (migration 006), E-STOP button and banner on every page, Safety page; docs/safety.md with the ISO 3691-4 / R15.08 hand-off"
  - id: PR-24
