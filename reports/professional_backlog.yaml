  # ----- Integration ----------------------------------------------------------------------
  - id: PR-12
    area: Integration
    gap: Robots are controlled inside the simulator only
    build: VDA 5050 interface over MQTT (orders, instant actions, state messages); the simulated robots act as VDA 5050 vehicles
    phase: 10
    priority: high
    effort: M
    status: done
    evidence: "integration/vda5050: every simulated robot a VDA 5050 2.0 vehicle (state, connection, factsheet; order and instantActions acting on the simulator), the platform master control (orders from the dispatcher, node-by-node progress); in-process bus or MQTT (paho, Mosquitto in docker-compose); Integration page. MQTT path tested with a stand-in client, not yet against a live broker"
  - id: PR-13
    area: Integration
    gap: No business system connection
    build: ERP connector (order import, stock and shipment sync over REST/webhooks) with a mock ERP
    phase: 10
    priority: high
    effort: M
    status: done
    evidence: "integration/erp: sales orders pulled from the ERP or pushed to an HMAC-signed webhook, checked and imported exactly once (ERP customer and number kept), acknowledged or rejected; outbox with idempotency keys and retries for ship confirmations and hourly stock levels; mock ERP in-process or as a REST server (tested over HTTP); ERP panel; docs/erp.md"
  - id: PR-14
    area: Integration
    gap: No scanning
    build: Barcode / RFID scan events from simulated handhelds at receiving, picking and packing
    phase: 10
    priority: medium
    effort: S
    status: done
    evidence: "GS1 scan parser, keyboard-wedge and camera scanning, printable GS1 labels"
  - id: PR-15
    area: Integration
    gap: Events stay inside one process
    build: Message bus (MQTT or Kafka) for robot, order and alert events; other systems can subscribe
    phase: 10
    priority: medium
    effort: M
    status: done
    evidence: "integration/events: robot, order and outbound status, floor, safety, alert and warehouse events as CloudEvents 1.0 on warehouse/v1/{category}/{event} (MQTT or in-process), Server-Sent Events stream with login, replay after a sequence, event catalogue; Event stream panel; docs/events.md. Kafka not added"

  # ----- Operations ------------------------------------------------------------------------
  - id: PR-16
    area: Operations
    gap: No production monitoring
    build: Health and readiness checks, structured logs, metrics (Prometheus) and dashboards (Grafana), alert rules
    phase: 12
    priority: high
    effort: M
    status: done
    evidence: "/health and /ready (loop, database, broker; 503 when not ready), /metrics for Prometheus (HTTP by route, simulator loop, fleet, WMS, safety, alerts, VDA, ERP, events), request ids and JSON logs, Prometheus with 12 alert rules and a Grafana dashboard in docker-compose; docs/monitoring.md. Not run in containers here"
  - id: PR-17
    area: Operations
    gap: Single process, no recovery
    build: Restart recovery of the warehouse state, database backups and restore test, stateless API behind a load balancer
    phase: 12
    priority: high
    effort: M
    status: done
    evidence: "Signed state snapshots every 30 s and on shutdown, restored paused (engine, incidents, ERP outbox, event sequence); pg_dump backups with a restore test on a temporary server (656k rows identical); active/standby via a PostgreSQL lock behind nginx, failover in 1.7 s; docs/recovery.md"
  - id: PR-18
    area: Operations
    gap: No load testing
    build: Load and soak tests (API, live stream, many browser clients), response-time targets
    phase: 11
    priority: medium
    effort: S
    status: done
    evidence: "tests/load: API users, live-stream clients, soak and capacity ramp judged against configs/load_targets.yaml; found and fixed a 13 s inventory stall, a per-request login lookup, costly KPIs and a 750 MB route cache; about 50 screens per backend meet p95 250 ms; docs/load_testing.md"
  - id: PR-19
    area: Operations
    gap: Models are trained once
    build: "MLOps: drift monitoring of live predictions against outcomes, retraining trigger, model versions promoted after tests"
    phase: 11
    priority: medium
    effort: M
    status: done
    evidence: "Drift of the ETA and late-risk models (input PSI, live error vs test and vs go-live), confirmed drift retrains on old + live data, a 5-test gate, versioned registry with promotion and rollback, AI models page; experiment: slower picking detected, v2/v3 promoted, 10-18 % better than v1; docs/mlops.md"

  # ----- AI realism -------------------------------------------------------------------------
