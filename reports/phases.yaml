# Phase register for the main project report (reports/Project_Progress_Report.pdf).
# Update this file at the end of every phase, then rebuild:
#     python scripts/build_project_report.py --snapshot
#
# status:      done | in progress | planned
# experiment:  the experiment ID (configs/experiments, results in evaluation/reports/phase4/runs.csv)
#              whose KPIs represent the warehouse after this phase. Phases that only predict or
#              explain (no change to decisions) keep the KPIs of the phase before them.
# kpi_effect:  "decisions" if the phase changes how the warehouse acts, "advisory" if it only informs.

phases:
  - id: 1
    name: Foundation
    status: done
    layer: Baseline
    added: >-
      Monorepo, FastAPI backend, Next.js frontend, PostgreSQL schema (19 tables), REST + WebSocket,
      Docker, CI checks, configuration in YAML.
    measured: Automated tests, Ruff and TypeScript strict clean.
    result: Platform skeleton running locally.
    docs: docs/README.md
    kpi_effect: none

  - id: 2
    name: Simulator (realistic 3D) + dataset v3
    status: done
    layer: Baseline
    added: >-
      Tick-based warehouse engine (80 x 50 m, 40 AMRs, 1,584 rack bays, one-way aisles), faults,
      hazards, workers, charging, rule-based dispatcher (nearest robot, BFS), 3D twin;
      91-day dataset v3 (tasks 161k rows, demand 2,184 h, anomaly windows 5.2 M, 2,400 images).
    measured: Golden-master fingerprint, 37 tests, dataset validation report.
    result: Reference warehouse = experiment E2 (the baseline every later phase is compared with).
    docs: docs/class_overview.md
    experiment: E2
    kpi_effect: decisions

  - id: 3
    name: Classical ML
    status: done
    layer: Layer 3
    added: >-
      ETA (Gradient Boosting), late risk (Logistic Regression), demand total (Gradient Boosting),
      demand per zone / priority (Linear Regression, XGBoost), anomaly (XGBoost; Isolation Forest and
      DBSCAN compared); live predictions and alerts saved to the database.
    measured: Held-out test set (last 2 weeks), each model vs a simple baseline method.
    result: ETA MAE 38.8 vs 65.4 ticks; late-risk F1 0.90; anomaly F1 0.81 vs 0.51 (rule).
    docs: docs/phase3_role_and_roadmap.md
    experiment: E2
    kpi_effect: advisory

  - id: 4
    name: Optimisation
    status: done
    layer: Layer 4
    added: >-
      Dijkstra / A* with traffic costs, ETA-based and Hungarian (global) assignment, demand-aware
      positioning, predictive charging, strategy switch in the app; 10 experiments x 5 seeds x 24 h.
    measured: Paired comparison with E2 on the same seeds (common random numbers).
    result: Best = E4d, -21.4 % completion, -42.9 % p90, -40.1 % late (5/5 days).
    docs: docs/phase4_optimization.md
    experiment: E4d
    kpi_effect: decisions

  - id: 5
    name: Deep learning + vision
    status: done
    layer: Layer 5
    added: >-
      LSTM fault detector on raw telemetry sequences; MLP, LSTM and Transformer demand forecasts
      (5 seeds each); YOLO11s object detector on 2,400 rendered camera images (trained on Colab GPU).
    measured: Same test sets as Phase 3 (faults, demand); held-out test images (vision); control models.
    result: >-
      Faults F1 0.835 vs 0.813 (14/14 days, LSTM live); demand MAE 7.42 vs 8.51; vision mAP50 0.908;
      Vision page with camera wall and live detection for moving robots.
    docs: docs/phase5_deep_learning_vision.md
    experiment: E4d
    kpi_effect: advisory
  - id: 6
    name: NLP + Transformers
    status: done
    layer: Layer 6
    added: >-
      Operator copilot: 5,461 labelled commands (17 intents, 13 entity types); keyword-rule and
      TF-IDF baselines; fine-tuned DistilBERT (intent + BIO entity heads); approval-gated actions.
    measured: Test on phrasing templates never seen in training; exact tool call; typo noise.
    result: >-
      Exact tool call 0.807 vs 0.725 (TF-IDF) and 0.656 (rules); 0.762 with typos; Copilot page with
      live checks, approve / cancel and audit trail.
    docs: docs/phase6_nlp.md
    experiment: E4d
    kpi_effect: advisory
  - id: 7
    name: RAG
    status: done
    layer: Layer 7
    added: >-
      Knowledge assistant over 6 warehouse PDFs (120 sections): section chunks, BM25 + MiniLM
      hybrid retrieval with a cross-encoder reranker, pgvector store, "not covered" threshold,
      extractive answers with citations (optional Claude), Knowledge page and Copilot questions.
    measured: 94 questions with cited sections; choices on 38 development, 56 test scored once.
    result: >-
      Test hit@3 0.962, MRR 0.910, first citation right 0.865 (dense only 0.769); 3 of 4
      unanswerable refused, 7 of 52 answerable too; answers cite a right section 0.889.
    docs: docs/phase7_rag.md
    experiment: E4d
    kpi_effect: advisory
  - id: 8
    name: Tools + agents
    status: done
    layer: Layer 8
    added: >-
      Operations agent: 15 typed tools (JSON schemas, read/write, approval for every write,
      validated against the live warehouse), an agent loop with a step budget and an approval
      gate, an offline planner following the SOPs and a Claude tool-use planner (with an API key),
      safe aisle closure (scheduled until clear), API and Operations agent panel; SOP-04 enforced
      in the dispatcher.
    measured: >-
      92 simulator situations replayed to the exact state, every write approved, 200 ticks of the
      warehouse afterwards, the scenario checks applied to what happened.
    result: >-
      Task success 97 % (89 of 92), no forbidden tool called, all within the step budget, 1.9 tool
      calls on average; failures: no free robot, a reference answer that assumed picked items could
      move, one retrieval miss.
    docs: docs/phase8_agents.md
    experiment: agents_eval
    kpi_effect: advisory
  - {id: 9, name: Multi-agent + RL, status: planned, layer: Layer 9}
  - {id: 10, name: Integration, status: planned, layer: Layer 10}
  - {id: 11, name: Evaluation (E1-E7), status: planned, layer: Layer 11}
  - {id: 12, name: Finalization, status: planned, layer: Layer 12}
