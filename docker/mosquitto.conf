# MQTT broker for the VDA 5050 robot interface (docker-compose service "mosquitto").
# Published on 127.0.0.1 only. A networked or production broker needs TLS (listener 8883 with
# certfile/keyfile), password_file or client certificates, and an ACL per vehicle (SECURITY.md).
listener 1883
allow_anonymous true
persistence false
log_dest stdout
