name: warehouse-ai
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse"]
      interval: 5s
      retries: 10
    ports: ["5432:5432"]

  qdrant:
    image: qdrant/qdrant:latest
    volumes: [qdrantdata:/qdrant/storage]
    ports: ["6333:6333"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    volumes: [mlflowdata:/mlflow]
    ports: ["5000:5000"]

  api:
    build: {context: .., dockerfile: docker/Dockerfile.api}
    env_file: ../.env
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5

  twin:
    build: {context: .., dockerfile: docker/Dockerfile.twin}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
    ports: ["3000:3000"]

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_HOST: localhost
      WEBHOOK_URL: http://localhost:5678/
    volumes: [n8ndata:/home/node/.n8n]
    ports: ["5678:5678"]

volumes:
  pgdata:
  qdrantdata:
  mlflowdata:
  n8ndata:
