# Load balancer for two backends in active-standby (docs/recovery.md, docker-compose.ha.yml).
# Only the active backend does work; the standby answers 503 to everything but /health, /ready
# and /metrics, so nginx moves the request to the other one. A standby refuses before doing
# anything, so retrying a POST there is safe (non_idempotent).
events {}

http {
  upstream warehouse_api {
    server backend:8000 max_fails=1 fail_timeout=2s;
    server backend-standby:8000 max_fails=1 fail_timeout=2s;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  server {
    listen 8080;
    client_max_body_size 2m;

    location / {
      proxy_pass http://warehouse_api;
      proxy_next_upstream error timeout http_503 non_idempotent;
      proxy_next_upstream_tries 2;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # TRUST_PROXY_HEADERS=true
      proxy_set_header X-Request-ID $request_id;
      # live stream (WebSocket) and Server-Sent Events
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 1h;
    }
  }
}
