# TLS-terminating nginx for the Warehouse AI Platform (PR-02, Phase 12).
#
# Usage (single-host, cert from Let's Encrypt or self-signed):
#   - Put your cert at ./certs/warehouse.crt and key at ./certs/warehouse.key
#     (or point the docker-compose.tls.yml volume mounts to your certbot path).
#   - Start with: docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# What this config does:
#   * HTTP (80) → permanent redirect to HTTPS
#   * HTTPS (443) → reverse-proxy to the backend on port 8000
#   * WebSocket and SSE pass-through (Upgrade header preserved)
#   * HSTS with a 1-year max-age (matches the security header the FastAPI app emits)
#   * TLS 1.2 / 1.3 only; strong cipher list; OCSP stapling

events {}

http {
  # Redirect all plain HTTP to HTTPS.
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 2m;

    ssl_certificate     /etc/nginx/certs/warehouse.crt;
    ssl_certificate_key /etc/nginx/certs/warehouse.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # HSTS (matches the HSTS header emitted by FastAPI SecurityHeadersMiddleware).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
      proxy_pass         http://backend:8000;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   X-Request-ID $request_id;
      # WebSocket and SSE
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection $connection_upgrade;
      proxy_buffering    off;
      proxy_read_timeout 1h;
    }
  }
}
