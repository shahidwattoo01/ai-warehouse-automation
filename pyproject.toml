[project]
name = "warehouse-ai-platform"
version = "0.1.0"
description = "AI-Powered Autonomous Warehouse Automation & Fleet Intelligence Platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests", "apps/backend/tests"]
pythonpath = [".", "apps/backend"]
# Both test folders are packages named "tests"; importlib mode keeps them apart.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# (str, Enum) is kept on purpose: StrEnum changes str()/format() output used in payloads.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]  # notebook prose and URLs

[tool.ruff.lint.isort]
known-first-party = ["simulation", "ai", "app", "scripts"]
