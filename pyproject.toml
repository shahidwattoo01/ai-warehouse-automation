[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-ai-platform"
version = "0.1.0"
description = "AI warehouse robot fleet intelligence: simulator, 3D twin and AI layers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pydantic>=2.5",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "msgpack>=1.0",
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "xgboost>=2.0", "lightgbm>=4.3", "statsmodels>=0.14", "optuna>=3.5", "shap>=0.44", "mlflow>=2.10", "evidently>=0.4", "scipy>=1.11", "ortools>=9.8"]
dl = ["torch>=2.2", "lightning>=2.2"]
vision = ["opencv-python>=4.9", "albumentations>=1.4", "ultralytics>=8.1", "fiftyone>=0.23"]
nlp = ["transformers>=4.38", "datasets>=2.18", "spacy>=3.7", "scikit-learn>=1.4"]
rag = ["sentence-transformers>=2.5", "qdrant-client>=1.8", "rank-bm25>=0.2", "pymupdf>=1.23", "ragas>=0.1"]
agents = ["langgraph>=0.0.30", "langfuse>=2.0", "anthropic>=0.20"]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.3", "tensorboard>=2.16"]
dev = ["pytest>=8", "pytest-cov>=4.1", "hypothesis>=6.98", "httpx>=0.27", "ruff>=0.3", "mypy>=1.8", "pre-commit>=3.6", "pandera>=0.18", "dvc>=3.40", "jsonschema>=4.21", "types-PyYAML"]
all = ["warehouse-ai-platform[ml,dl,vision,nlp,rag,agents,rl,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
warehouse_ai = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["warehouse_ai"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (soak, performance)",
    "gpu: tests that need a GPU",
    "integration: needs running services",
]
