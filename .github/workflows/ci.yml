# Continuous integration: every push and pull request is linted, tested and built.
# Trained models and datasets are not in Git; tests that need them skip themselves (see the test
# files), everything else runs here, including the database tests against a real PostgreSQL.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  YOLO_OFFLINE: "1" # no Ultralytics analytics or online checks
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Backend · lint, tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: warehouse_ai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warehouse -d warehouse_ai"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://warehouse:ci-only-password@localhost:5432/warehouse_ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Database schema and reference data
        run: |
          python tasks.py migrate
          python scripts/seed.py
      - name: Tests
        run: python -m pytest -q
      - name: Known vulnerabilities in dependencies (report)
        # Reported, not blocking: a new advisory should not break unrelated work; review the log.
        continue-on-error: true
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend · types and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Known vulnerabilities in dependencies (report)
        continue-on-error: true
        run: npm audit --omit=dev

  docker:
    name: Docker · backend image builds and imports
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -f docker/backend.Dockerfile -t warehouse-backend:ci .
      - name: The image can load OpenCV, YOLO and the app
        run: >-
          docker run --rm warehouse-backend:ci python -c
          "import cv2, ultralytics, torch; from app.main import app; print('ok', cv2.__version__, ultralytics.__version__)"
