name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy
      - run: python scripts/check_contracts.py
      - run: pytest -m "not slow and not integration" --cov=warehouse_ai --cov-report=term-missing

  twin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/twin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/twin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python, twin]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker/docker-compose.yml build
